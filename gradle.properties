# Gradle JVM — reduced to 2g to fit sandbox memory limits
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Compose — use the Compose compiler Gradle plugin (Kotlin 2.0+)
# No separate composeOptions / kotlinCompilerExtensionVersion needed.

# Build caching
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false

# Disable VFS file watching — avoids journal lock corruption in this sandbox
org.gradle.vfs.watch=false

# Pass JDK 17 to toolchains
org.gradle.java.home=/home/user/tools/jdk-17.0.20.1+1
