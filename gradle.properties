# Gradle JVM — 2g heap keeps CI runners and low-memory sandboxes happy
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Compose — use the Compose compiler Gradle plugin (Kotlin 2.0+)
# No separate composeOptions / kotlinCompilerExtensionVersion needed.

# Build caching
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false

# Disable VFS file watching — avoids journal lock corruption in sandboxes
org.gradle.vfs.watch=false